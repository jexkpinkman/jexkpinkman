<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Animated skull">
  <defs>
    <radialGradient id="bone" cx="50%" cy="32%" r="75%">
      <stop offset="0" stop-color="#f5f5f4"/>
      <stop offset="1" stop-color="#a8a29e"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- aura -->
  <circle cx="120" cy="118" r="92" fill="#b91c1c" filter="url(#soft)" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.42;0.15" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="3.5s" repeatCount="indefinite"/>

    <!-- skull -->
    <path d="M120 28 C74 28 46 62 46 104 C46 130 58 148 76 158 L76 188 L164 188 L164 158 C182 148 194 130 194 104 C194 62 166 28 120 28 Z"
          fill="url(#bone)" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>

    <!-- crack -->
    <path d="M152 36 L143 58 L153 71 L146 86" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

    <!-- eye sockets -->
    <ellipse cx="90" cy="108" rx="21" ry="25" fill="#0a0a0a"/>
    <ellipse cx="150" cy="108" rx="21" ry="25" fill="#0a0a0a"/>

    <!-- glowing pupils -->
    <circle cx="90" cy="112" r="6" fill="#ef4444">
      <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="112" r="6" fill="#ef4444">
      <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- nose -->
    <path d="M120 128 L109 152 L131 152 Z" fill="#0a0a0a"/>

    <!-- teeth -->
    <line x1="80" y1="168" x2="160" y2="168" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
    <line x1="94" y1="168" x2="94" y2="188" stroke="#111111" stroke-width="3"/>
    <line x1="107" y1="168" x2="107" y2="188" stroke="#111111" stroke-width="3"/>
    <line x1="120" y1="168" x2="120" y2="188" stroke="#111111" stroke-width="3"/>
    <line x1="133" y1="168" x2="133" y2="188" stroke="#111111" stroke-width="3"/>
    <line x1="146" y1="168" x2="146" y2="188" stroke="#111111" stroke-width="3"/>
  </g>
</svg>
