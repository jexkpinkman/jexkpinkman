<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="800" height="20" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="10" x2="800" y2="10" stroke="#57534e" stroke-width="1" stroke-opacity="0.6"/>
  <rect x="-200" y="9" width="200" height="2" fill="url(#g)">
    <animate attributeName="x" from="-200" to="800" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="396" y="6" width="8" height="8" fill="#ef4444" transform="rotate(45 400 10)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
